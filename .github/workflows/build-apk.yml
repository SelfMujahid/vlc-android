name: Build Custom VLC Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2 platform-tools'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y automake ant autoconf libtool wget libtool-bin gawk patch build-essential protobuf-compiler

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-VLC-APK
        path: application/app/build/outputs/apk/debug/*.apk
