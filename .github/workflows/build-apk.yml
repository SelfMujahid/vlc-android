name: Build Custom VLC Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2 platform-tools ndk;25.2.9519653'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y automake ant autoconf libtool wget libtool-bin gawk patch build-essential protobuf-compiler gettext cmake libstdc++6

    - name: Fix NDK Path for VLC
      run: |
        sudo ln -s $ANDROID_HOME/ndk/25.2.9519653 $ANDROID_HOME/ndk-bundle

    - name: Run VLC Compile Script
      env:
        ANDROID_SDK: ${{ env.ANDROID_HOME }}
        ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk-bundle
      run: |
        # Root directory se direct script run karni hai (cd buildsystem nahi karna)
        ./buildsystem/compile.sh -a arm64-v8a

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-VLC-APK
        path: application/app/build/outputs/apk/debug/*.apk
